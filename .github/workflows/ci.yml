# On every push to main: typecheck, engine tests and formatting (npm test), the web UI's smoke test in
# headless Chromium (npm run test:ui, which starts its own dev server), and a production build of the
# web UI. The build is published to GitHub Pages when the repository has Pages enabled (settings →
# Pages → source "GitHub Actions"); until then the deploy job is skipped, not failed.
#
# The app is one page whose whole state lives in the URL hash, which never reaches the server, so no
# 404 redirect trick is needed for deep links: every link is index.html plus a hash.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
